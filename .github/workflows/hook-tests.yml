name: Review Gate Hook Tests

on:
  pull_request:
    paths:
      - ".claude/hooks/**"
      - "tests/hooks/**"
  push:
    branches: [main]
    paths:
      - ".claude/hooks/**"
      - "tests/hooks/**"

jobs:
  hook-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run require-review hook tests
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          bash tests/hooks/test_require_review.sh
