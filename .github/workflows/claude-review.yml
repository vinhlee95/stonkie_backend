name: Claude Multi-Angle Review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude review') &&
       github.event.comment.author_association == 'OWNER')
    # job-level: workflow-level concurrency would let skipped runs (any PR comment) cancel a live review
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Resolve PR refs
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          data=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefOid,headRefOid,isCrossRepository)
          # fork PRs never reach the secret-bearing steps: their checkout would supply .claude/ config + hooks
          if [ "$(jq -r .isCrossRepository <<<"$data")" = "true" ]; then
            echo "same_repo=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping multi-angle review for a fork PR."
          else
            echo "same_repo=true" >> "$GITHUB_OUTPUT"
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "base=$(jq -r .baseRefOid <<<"$data")" >> "$GITHUB_OUTPUT"
          echo "head=$(jq -r .headRefOid <<<"$data")" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        if: steps.pr.outputs.same_repo == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0

      - name: Multi-angle review
        if: steps.pr.outputs.same_repo == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /multi-review ci ${{ steps.pr.outputs.number }} ${{ steps.pr.outputs.base }} ${{ steps.pr.outputs.head }}
          claude_args: |
            --max-turns 60
            --allowedTools "Agent,Task,Read,Grep,Glob,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh api repos/*/issues/*/comments:*),Bash(gh api -X PATCH repos/*/issues/comments/*:*),mcp__github_inline_comment__create_inline_comment"
